# cspell:ignore colima virtiofs testdata
"$schema" = "https://raw.githubusercontent.com/air-verse/air/master/.air.schema.json"

root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/api ./cmd/api"
bin = "./tmp/api"
delay = 500
# Overrides air's defaults wholesale, so vendor/testdata are restated here.
# .git matters under poll = true: air walks the tree every interval.
exclude_dir = ["tmp", "docker", "docs", "vendor", "testdata", ".git"]
include_ext = ["go"]
# Poll instead of relying on filesystem events. The source tree is bind-mounted
# from the host, and colima (virtiofs) forwards only chmod/attribute events, not
# real write events — so an event-based watcher sits there seeing nothing while
# you edit (colima#1244, colima#1341; Docker Desktop on macOS/Windows has the
# same class of problem). "Hot reload silently stopped working" is a miserable
# thing to debug, so trade a little CPU for a watcher that always fires.
# 1000ms keeps that CPU cost modest on a bind-mounted tree.
poll = true
poll_interval = 1000

# air SIGKILLs the process by default, so cmd/* graceful shutdown
# (signal.NotifyContext + Shutdown) would never actually run in dev, and every
# reload would sever in-flight requests and SSE streams mid-stream. Send SIGINT
# and give it a few seconds to drain — which also means the shutdown path is
# exercised constantly during development instead of only in production.
send_interrupt = true
kill_delay = "5s"

[log]
time = true
