root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/worker ./cmd/worker"
bin = "./tmp/worker"
delay = 500
exclude_dir = ["tmp", "docker", "docs"]
include_ext = ["go"]
# See .air.toml — filesystem events do not cross the VM boundary backing Docker
# on macOS/Windows, so poll rather than silently never rebuilding.
poll = true
poll_interval = 1000

[log]
time = true
