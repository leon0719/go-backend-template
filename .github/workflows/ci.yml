name: CI

on:
  push:
    branches: [main]
  pull_request:

# Tool versions are pinned so a new upstream release can never silently
# change CI behavior (a new linter default failing every PR, or a sqlc/swag
# codegen change breaking the drift check). Bump these deliberately.
#
# GOLANGCI_LINT_VERSION is coupled to the major version of
# golangci/golangci-lint-action below: the action rejects a golangci-lint
# major it predates ("golangci-lint v2 is not supported by
# golangci-lint-action v6"). Moving golangci-lint across a major means
# bumping the action too.
env:
  GOLANGCI_LINT_VERSION: v2.12.2
  SQLC_VERSION: v1.31.1
  SWAG_VERSION: v1.16.6

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          fmt_files="$(gofmt -l .)"
          if [ -n "$fmt_files" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_files"
            echo "Run 'make format' (or 'gofmt -l -w .') and commit the result."
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@${{ env.SQLC_VERSION }}

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@${{ env.SWAG_VERSION }}

      - name: Check sqlc-generated code is up to date
        run: |
          sqlc generate
          if ! git diff --exit-code -- internal/db/sqlc/; then
            echo "sqlc-generated code is out of date. Run 'sqlc generate' and commit the result."
            exit 1
          fi

      - name: Check swag-generated docs are up to date
        run: |
          swag init -g cmd/api/main.go -o internal/httpserver/docs
          if ! git diff --exit-code -- internal/httpserver/docs/; then
            echo "swag-generated docs are out of date. Run 'make docs' and commit the result."
            exit 1
          fi

      # -race is not optional here: this service runs an SSE hub, asynq
      # workers, and a Redis-backed rate limiter, all of which are concurrent
      # code where a data race is invisible until production.
      - name: Unit tests
        run: go test -race ./...

      - name: Integration tests
        run: go test -race -tags=integration ./...

      # Scans the module graph against the Go vulnerability database and only
      # reports vulns actually reachable from this code, so it stays low-noise
      # enough to gate every PR on.
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build prod image
        run: docker build -f docker/Dockerfile.prod -t go-backend-template:ci .
