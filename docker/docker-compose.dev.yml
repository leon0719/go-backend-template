services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      ENV: local
      PORT: "8000"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/go_backend_template?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-me
      LOG_LEVEL: debug
    env_file:
      - path: ../.env.local
        required: false
    volumes:
      - ..:/app
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    command: ["air", "-c", ".air.worker.toml"]
    environment:
      ENV: local
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/go_backend_template?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-me
      LOG_LEVEL: debug
    env_file:
      - path: ../.env.local
        required: false
    volumes:
      - ..:/app
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go_backend_template
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
