# Explicit project name so Compose does not derive it from the enclosing
# "docker" directory and collide with unrelated projects on the same host.
name: go-backend-template

services:
  # One-off migration job. The prod image (gcr.io/distroless/static-debian12)
  # has no shell and no goose binary, so migrations are applied by /migrate,
  # a small binary built from cmd/migrate that embeds the goose SQL files
  # (see internal/db/migrations/embed.go) and runs them via the goose
  # library directly. api/worker wait for this to exit 0 before starting.
  #
  # migrate owns the only `build:` block; api and worker reference the same
  # `image:` it produces so the multi-stage image is built once and reused
  # (all three binaries live in the same image, selected via `entrypoint:`).
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
    image: go-backend-template:latest
    entrypoint: ["/migrate", "up"]
    env_file:
      - ../.env.prod
    # No restart policy: this is a run-once job. `on-failure` would be
    # defensible; `unless-stopped` would loop it forever.
    restart: "no"

  api:
    image: go-backend-template:latest
    entrypoint: ["/api"]
    env_file:
      - ../.env.prod
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # distroless has no wget/curl/shell; the api binary implements its own
      # -healthcheck mode (GET /health/live, exit 0/1) for exactly this.
      test: ["CMD", "/api", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: go-backend-template:latest
    entrypoint: ["/worker"]
    env_file:
      - ../.env.prod
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # asynq.Scheduler (the Celery Beat equivalent). Run EXACTLY ONE instance:
  # a scheduler per worker replica would enqueue every periodic task N times.
  scheduler:
    image: go-backend-template:latest
    entrypoint: ["/scheduler"]
    env_file:
      - ../.env.prod
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      # Caddy stores its issued certificates and account keys under /data.
      # Without a volume they are regenerated on every container restart,
      # which re-issues certs (and burns ACME rate limits on a public CA).
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - ../.env.prod
    restart: unless-stopped
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
